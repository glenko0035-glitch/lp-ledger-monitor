name: Refresh LP monitor

on:
  push:
    branches: [main]
  schedule:
    # 01:17, 09:17, 17:17 UTC = 北京时间 09:17, 17:17, 01:17
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lp-monitor-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh wallet every eight hours
        if: ${{ github.event_name != 'schedule' }}
        run: node scripts/refresh.mjs
      - name: Scheduled wallet refresh
        if: ${{ github.event_name == 'schedule' }}
        run: |
          hour=$(date -u +%H)
          if [ "$hour" = "01" ] || [ "$hour" = "09" ] || [ "$hour" = "17" ]; then node scripts/refresh.mjs; fi
      - run: npx playwright install --with-deps chromium
      - name: Collect official pool Stats
        id: official
        continue-on-error: true
        env:
          HEADED: '1'
        run: xvfb-run -a node scripts/official-pool.mjs
      - run: npm run build
      - name: Save updated monitoring data
        run: |
          git config user.name "LP Monitor Bot"
          git config user.email "lp-monitor-bot@users.noreply.github.com"
          git add app/official-pool.json app/ledger.json app/pool-market.json app/snapshot.json data/monitor-state.json data/pool-source-response.json data/receipts.json
          git diff --cached --quiet || git commit -m "Refresh LP monitoring snapshot"
          git push
      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --config dist/server/wrangler.json --name lp-ledger-monitor
