name: Refresh LP monitor

on:
  schedule:
    # 01:17, 09:17, 17:17 UTC = 北京时间 09:17, 17:17, 01:17
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lp-monitor-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/refresh.mjs
      - run: npm run build
      - name: Save updated monitoring data
        run: |
          git config user.name "LP Monitor Bot"
          git config user.email "lp-monitor-bot@users.noreply.github.com"
          git add app/ledger.json app/pool-market.json app/snapshot.json data/monitor-state.json data/pool-source-response.json data/receipts.json
          git diff --cached --quiet || git commit -m "Refresh LP monitoring snapshot"
          git push
