name: Refresh LP monitor

on:
  push:
    branches: [main]
  schedule:
    # 01:17, 09:17, 17:17 UTC = 北京时间 09:17, 17:17, 01:17
    - cron: '17 1,9,17 * * *'
    # Pool-only sampling during the other hours; no duplicate scheduled runs.
    - cron: '17 0,2-8,10-16,18-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lp-monitor-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh wallet every eight hours
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 1,9,17 * * *' }}
        run: node scripts/refresh.mjs
      - name: Catch up overdue wallet snapshot
        if: ${{ github.event_name == 'schedule' && github.event.schedule != '17 1,9,17 * * *' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const asOf = JSON.parse(fs.readFileSync('app/snapshot.json', 'utf8')).asOf;
          const age = Date.now() - Date.parse(asOf);
          if (!Number.isFinite(age) || age >= 8 * 60 * 60 * 1000) {
            console.log('Wallet snapshot is overdue; catching up. Last snapshot:', asOf);
            execFileSync(process.execPath, ['scripts/refresh.mjs'], {stdio: 'inherit'});
          } else {
            console.log('Wallet snapshot is current; pool-only refresh. Last snapshot:', asOf);
          }
          NODE
      - run: npx playwright install --with-deps chromium
      - name: Collect official pool Stats
        id: official
        continue-on-error: true
        env:
          HEADED: '1'
        run: xvfb-run -a node scripts/official-pool.mjs
      - name: Refresh ecosystem Dune cache
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: node scripts/ecosystem.mjs
      - name: Verify portfolio accounting
        run: |
          node scripts/portfolio.test.mjs
          node scripts/verify.mjs
      - run: npm run build
      - name: Save updated monitoring data
        run: |
          git config user.name "LP Monitor Bot"
          git config user.email "lp-monitor-bot@users.noreply.github.com"
          git add app/ecosystem/data.json app/official-pool.json app/ledger.json app/pool-market.json app/snapshot.json data/monitor-state.json data/pool-source-response.json data/receipts.json
          git diff --cached --quiet || git commit -m "Refresh LP monitoring snapshot"
          git push
      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --config dist/server/wrangler.json --name lp-ledger-monitor
